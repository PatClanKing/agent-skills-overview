<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="342px" preserveAspectRatio="none" style="width:502px;height:342px;background:#FFFFFF;" version="1.1" viewBox="0 0 502 342" width="502px" zoomAndPan="magnify"><title>How a skill loads (progressive disclosure)</title><defs/><g><g class="title" data-source-line="4"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="279.3164" x="108.0918" y="24.5332">How a skill loads (progressive disclosure)</text></g><!--entity L1--><g class="entity" data-entity="L1" data-source-line="6" data-uid="ent0002" id="entity_L1"><rect fill="#ECEFF1" height="65.2813" rx="3" ry="3" style="stroke:#37474F;stroke-width:1;" width="224.1465" x="6" y="50.6094"/><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="95.3965" x="16" y="73.0664">Level 1: metadata</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="171.0762" x="16" y="88.1602">name + description of every skill</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="204.1465" x="16" y="103.2539">about 100 tokens each, always loaded</text></g><!--entity M--><g class="entity" data-entity="M" data-source-line="7" data-uid="ent0003" id="entity_M"><rect fill="#ECEFF1" height="50.1875" rx="3" ry="3" style="stroke:#37474F;stroke-width:1;" width="208.7539" x="13.5" y="168.6094"/><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="188.7539" x="23.5" y="191.0664">User request matches a description</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="158.0508" x="23.5" y="206.1602">(or the user types /skill-name)</text></g><!--entity L2--><g class="entity" data-entity="L2" data-source-line="8" data-uid="ent0004" id="entity_L2"><rect fill="#ECEFF1" height="50.1875" rx="3" ry="3" style="stroke:#37474F;stroke-width:1;" width="202.1211" x="17" y="279.1094"/><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="127.4121" x="27" y="301.5664">Level 2: SKILL.md body</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="182.1211" x="27" y="316.6602">loaded on trigger, under 5k tokens</text></g><!--entity L3--><g class="entity" data-entity="L3" data-source-line="9" data-uid="ent0005" id="entity_L3"><rect fill="#ECEFF1" height="65.2813" rx="3" ry="3" style="stroke:#37474F;stroke-width:1;" width="200.791" x="295.5" y="271.6094"/><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="98.0508" x="305.5" y="294.0664">Level 3: resources</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="156.0645" x="305.5" y="309.1602">references/ read, scripts/ run,</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="180.791" x="305.5" y="324.2539">assets/ copied, only when needed</text></g><g class="link" data-entity-1="L1" data-entity-2="M" data-uid="lnk6" id="link_L1_M"><polygon fill="#37474F" points="118,168.3169,122,159.3169,118,163.3169,114,159.3169,118,168.3169" style="stroke:#37474F;stroke-width:1;"/><path d="M118,115.7837 C118,132.547 118,146.8104 118,162.3169" fill="none" style="stroke:#37474F;stroke-width:1;"/><text fill="#37474F" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="70.9307" x="120" y="147.0283">model decides</text></g><g class="link" data-entity-1="M" data-entity-2="L2" data-uid="lnk7" id="link_M_L2"><polygon fill="#37474F" points="118,279.097,122,270.097,118,274.097,114,270.097,118,279.097" style="stroke:#37474F;stroke-width:1;"/><path d="M118,218.689 C118,236.6693 118,255.1329 118,273.097" fill="none" style="stroke:#37474F;stroke-width:1;"/><text fill="#37474F" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="78.8745" x="120" y="250.0283">reads SKILL.md</text></g><g class="link" data-entity-1="L2" data-entity-2="L3" data-uid="lnk8" id="link_L2_L3"><polygon fill="#37474F" points="295.39,304.1094,286.39,300.1094,290.39,304.1094,286.39,308.1094,295.39,304.1094" style="stroke:#37474F;stroke-width:1;"/><path d="M219.1508,304.1094 C243.9905,304.1094 264.5758,304.1094 289.39,304.1094" fill="none" style="stroke:#37474F;stroke-width:1;"/><text fill="#37474F" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="55.043" x="229.75" y="297.5283">on demand</text></g></g></svg>